name: Website

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'README.md'
      - 'docs/**'
      - 'src/relf_agent/**'
      - 'pyproject.toml'
  push:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'README.md'
      - 'docs/**'
      - 'src/relf_agent/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
        working-directory: .
      - run: npm run verify
