name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python examples/evaluate.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Installed wheel smoke test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf --db wheel-demo.sqlite demo --ticket CI-001
          ralf --format text init wheel-starter
          cd wheel-starter
          python -m agent_app --ticket CI-STARTER
      - name: Installed graph starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-graph --template graph
          cd wheel-graph
          python -m agent_app --input urgent --command-id CI-GRAPH
