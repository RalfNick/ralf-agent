name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,pdf,tokenizer,skills]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m ralf_agent.business_evaluation_cli --offline --max-calls 16
      - run: python examples/evaluate.py
      - run: python examples/evaluate_planning.py --fixture evals/planning-fixtures.json
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Installed default Session receipt contracts
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/session-contracts"
          cp -R "$GITHUB_WORKSPACE/tests" "$RUNNER_TEMP/session-contracts/tests"
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_default_session_receipts.py" "$RUNNER_TEMP/session-contracts/tests/test_default_session_runtime.py" "$RUNNER_TEMP/session-contracts/tests/test_default_session_process.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_session_data.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_context_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_context_read_protocol.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_context_read_state.py" "$RUNNER_TEMP/session-contracts/tests/test_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_review.py" "$RUNNER_TEMP/session-contracts/tests/test_tool_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_tool_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_tool_execution_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_tool_execution_runtime.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_tool_execution_review.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_bindings.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_binding_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_binding_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_binding_review.py"
      - name: Installed RAG and managed Plan Team task evaluation
        working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/evals" "$RUNNER_TEMP/session-contracts/evals"
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_rag_evaluation.py" "$RUNNER_TEMP/session-contracts/tests/test_rag_evaluation_cases.py" "$RUNNER_TEMP/session-contracts/tests/test_orchestration_evaluation.py" "$RUNNER_TEMP/session-contracts/tests/test_task_evaluation_cli.py"
          ralf-evaluate-rag --offline
          ralf-evaluate-orchestration --offline --kind plan-and-execute
          ralf-evaluate-orchestration --offline --kind team
      - name: Installed Skill document contracts outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_skill_documents.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_skill_documents.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_document_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_document_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_document_review.py"
      - name: Installed scoped Artifact bindings outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_artifact_bindings.py" "$RUNNER_TEMP/session-contracts/tests/test_artifact_binding_context.py" "$RUNNER_TEMP/session-contracts/tests/test_artifact_binding_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_artifact_binding_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_artifact_binding_lifetime.py" "$RUNNER_TEMP/session-contracts/tests/test_artifact_binding_review.py"
      - name: Installed passive Skill directory contracts outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_skill_selection.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_retrieval.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_retrieval_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_retrieval_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_retrieval_review.py"
      - name: Installed Sandbox contracts outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_sandbox.py" "$RUNNER_TEMP/session-contracts/tests/test_docker_sandbox.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_bindings.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_binding_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_binding_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_temporal_protocol.py" "$RUNNER_TEMP/session-contracts/tests/test_native_sandbox_leases.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_review.py"
      - name: Installed actual native Docker Sandbox outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          docker pull alpine:3.22
          export RALF_TEST_DOCKER_IMAGE="$(docker image inspect alpine:3.22 --format '{{.Id}}')"
          export RALF_TEST_DOCKER_SOCKET=/var/run/docker.sock
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_docker_sandbox_service.py" "$RUNNER_TEMP/session-contracts/tests/test_docker_sandbox_recovery_service.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_tools_service.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_binding_service.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_native_crash_service.py" "$RUNNER_TEMP/session-contracts/tests/test_sandbox_review_service.py"
      - name: Installed wheel smoke test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf --db wheel-demo.sqlite demo --ticket CI-001
          ralf --format text init wheel-starter
          cd wheel-starter
          python -m agent_app --ticket CI-STARTER
      - name: Installed Temporal declarations without an implicit connection
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_temporal_profiles.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_runtime_profile.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_assembly.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_assembly_cleanup.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_assembly_review.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_assembly_lifetime.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_worker_wrapping.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_profile_example.py" "$RUNNER_TEMP/session-contracts/tests/test_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_review.py"
          python -m ralf_agent.temporal_profile_example --data-dir "$RUNNER_TEMP/temporal-profile-config"
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_temporal_catalog_assembly.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_catalog_lifetime.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_profile_host.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_host_lifetime.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_host_routing.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_host_sessions.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_journal_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_catalog_example.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_host_review.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_startup_options.py" "$RUNNER_TEMP/session-contracts/tests/test_temporal_host_preflight.py" "$RUNNER_TEMP/session-contracts/tests/test_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_review.py"
          python -m ralf_agent.temporal_catalog_example --data-dir "$RUNNER_TEMP/temporal-catalog-config"
      - name: Installed fixed business tool contracts and CLI starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/session-contracts/tests/test_cli_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_cli_tool_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_cli_starter.py" "$RUNNER_TEMP/session-contracts/tests/test_http_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_http_tool_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_mcp_http.py" "$RUNNER_TEMP/session-contracts/tests/test_mcp_http_events.py" "$RUNNER_TEMP/session-contracts/tests/test_mcp_http_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_workspace.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_bindings.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_binding_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_binding_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_writes.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_workspace_writes.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_write_processes.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_write_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_write_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_workspace_write_review.py" "$RUNNER_TEMP/session-contracts/tests/test_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_filesystem_skills.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_tools.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_configuration.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_execution.py" "$RUNNER_TEMP/session-contracts/tests/test_skill_review.py"
      - name: Installed graph starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-graph --template graph
          cd wheel-graph
          python -m agent_app --input urgent --command-id CI-GRAPH

      - name: Installed document ingestion starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-ingest --template ingest
          cd wheel-ingest
          echo 'Pool timeout: inspect the connection pool.' > runbook.md
          python -m agent_app ingest runbook.md --document-id pool --command-id CI-INGEST --expected-version 0
          python -m agent_app query --query 'pool timeout' --command-id CI-ANSWER

      - name: Installed hybrid retrieval starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-hybrid --template hybrid
          cd wheel-hybrid
          echo 'Pool timeout: inspect the connection pool.' > runbook.md
          python -m agent_app ingest runbook.md --document-id pool --command-id CI-HYBRID-INGEST --expected-version 0
          python -m agent_app index --document-id pool
          python -m agent_app query --query 'pool timeout' --command-id CI-HYBRID-ANSWER

      - name: Installed context and artifact starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-context --template context
          cd wheel-context
          python -m agent_app --input 'pool timeout' --command-id CI-CONTEXT

      - name: Installed automatic memory starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-memory --template memory
          cd wheel-memory
          python -m agent_app
          python -m agent_app

      - name: Installed model compatibility starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf-check-model
          ralf init wheel-model-check --template model-check
          cd wheel-model-check
          python -m agent_app

      - name: Installed observable starter outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          ralf init wheel-observable --template observable
          cd wheel-observable
          python -m agent_app
          python -m agent_app

  remote-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ['6333:6333']
    env:
      RALF_TEST_REDIS_URL: 'redis://127.0.0.1:6379/0'
      RALF_TEST_POSTGRES_DSN: 'host=127.0.0.1 user=postgres password=local-test-only dbname=postgres'
      RALF_TEST_QDRANT_URL: 'http://127.0.0.1:6333'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install -e '.[dev,remote,server,temporal,skills]'
      - run: timeout 30 bash -c 'until curl --fail --silent http://127.0.0.1:6333/healthz; do sleep 1; done'
      - run: >-
          python -m pytest -q -W error
          tests/test_redis_memory_adapter.py tests/test_postgres_adapter.py
          tests/test_fact_index_redis.py tests/test_fact_index_postgres.py
          tests/test_session_binding_remote.py tests/test_data_binding_remote.py
          tests/test_qdrant_adapter.py tests/test_remote_assembly.py
          tests/test_messaging.py tests/test_redis_streams.py
          tests/test_handoff.py tests/test_a2a.py tests/test_a2a_http.py
          tests/test_task_controls.py tests/test_a2a_async.py
          tests/test_postgres_handoff.py tests/test_postgres_handoff_crash.py
          tests/test_postgres_ingestion.py tests/test_ingestion_crash.py tests/test_hybrid_remote.py
          tests/test_memory_pipeline_remote.py tests/test_temporal_session_data_remote.py
          tests/test_service_lifecycle.py tests/test_a2a_starter.py
      - name: Start an actual persisted Temporal Service
        run: |
          python -m tests.temporal_service_runner --state-dir "$RUNNER_TEMP/ralf-temporal" > "$RUNNER_TEMP/ralf-temporal.log" 2>&1 &
          timeout 120 bash -c 'until test -s "$RUNNER_TEMP/ralf-temporal/address"; do sleep 1; done'
          echo "RALF_TEST_TEMPORAL_ADDRESS=$(cat "$RUNNER_TEMP/ralf-temporal/address")" >> "$GITHUB_ENV"
      - name: Two-worker Temporal contracts and History replay
        run: python -m pytest -q -W error tests/test_model_adoption_contracts.py tests/test_recent_session_context.py tests/test_temporal_engine.py tests/test_temporal_service.py tests/test_a2a_temporal.py tests/test_temporal_composite_service.py tests/test_temporal_composites.py tests/test_temporal_context.py tests/test_temporal_facts.py tests/test_temporal_facts_service.py tests/test_temporal_knowledge_bindings.py tests/test_temporal_knowledge_service.py tests/test_temporal_sessions.py tests/test_temporal_session_client.py tests/test_temporal_session_service.py tests/test_temporal_session_recovery_service.py tests/test_temporal_limits.py tests/test_temporal_limits_service.py tests/test_temporal_completion.py tests/test_temporal_completion_service.py tests/test_temporal_decision.py tests/test_temporal_decision_service.py tests/test_temporal_binding_service.py tests/test_temporal_managed_context_service.py tests/test_temporal_session_data.py tests/test_temporal_session_data_service.py tests/test_temporal_parent_facade.py tests/test_temporal_starter.py tests/test_temporal_review.py tests/test_temporal_custom_context.py tests/test_temporal_custom_service.py tests/test_observable_temporal_service.py tests/test_temporal_session_tree_service.py tests/test_temporal_session_tree_crash_service.py tests/test_temporal_session_tree_remote.py tests/test_temporal_session_tree_data_context.py tests/test_temporal_session_tree_memory_rag.py tests/test_temporal_context_read_service.py tests/test_temporal_context_read_crash_service.py tests/test_temporal_context_read_remote.py tests/test_temporal_context_read_h3_service.py
      - name: Temporal Profile factories, owned shutdown and recovery
        run: python -m pytest -q -W error tests/test_temporal_assembly_review.py tests/test_temporal_profiles.py tests/test_temporal_runtime_profile.py tests/test_temporal_assembly.py tests/test_temporal_assembly_lifetime.py tests/test_temporal_assembly_cleanup.py tests/test_temporal_worker_wrapping.py tests/test_temporal_profile_example.py tests/test_temporal_profile_service.py tests/test_temporal_profile_remote.py tests/test_temporal_profile_close_service.py
      - name: Temporal multiversion Host and original queues
        run: python -m pytest -q -W error tests/test_temporal_catalog_assembly.py tests/test_temporal_catalog_lifetime.py tests/test_temporal_profile_host.py tests/test_temporal_host_lifetime.py tests/test_temporal_host_routing.py tests/test_temporal_host_sessions.py tests/test_temporal_journal_configuration.py tests/test_temporal_catalog_example.py tests/test_temporal_profile_host_service.py tests/test_temporal_host_close_service.py tests/test_temporal_host_review.py tests/test_temporal_startup_options.py tests/test_temporal_host_preflight.py tests/test_temporal_host_preflight_service.py tests/test_cli_temporal_service.py tests/test_http_temporal_service.py tests/test_mcp_http_temporal_service.py tests/test_workspace_temporal_service.py tests/test_workspace_binding_temporal.py tests/test_workspace_binding_review.py tests/test_workspace_binding_temporal_service.py tests/test_workspace_write_execution.py tests/test_workspace_write_temporal_service.py tests/test_skill_execution.py tests/test_skill_temporal_service.py tests/test_skill_binding_temporal.py tests/test_skill_binding_temporal_service.py tests/test_skill_document_temporal_service.py tests/test_workspace_write_lifetime_service.py
      - name: Actual Temporal Artifact bindings and independent Worker recovery
        run: python -m pytest -q -W error tests/test_artifact_binding_temporal.py tests/test_artifact_binding_temporal_review.py tests/test_artifact_binding_temporal_service.py tests/test_artifact_binding_lifetime_service.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Installed Temporal Artifact bindings outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-contracts"
          cp -R "$GITHUB_WORKSPACE/tests" "$RUNNER_TEMP/artifact-contracts/tests"
          python -m pytest -q -W error -p no:cacheprovider -c /dev/null "$RUNNER_TEMP/artifact-contracts/tests/test_artifact_binding_temporal.py" "$RUNNER_TEMP/artifact-contracts/tests/test_artifact_binding_temporal_review.py" "$RUNNER_TEMP/artifact-contracts/tests/test_artifact_binding_temporal_service.py" "$RUNNER_TEMP/artifact-contracts/tests/test_artifact_binding_lifetime_service.py"
      - name: Stop task-owned Temporal Service
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/ralf-temporal"; then
            touch "$RUNNER_TEMP/ralf-temporal/stop"
            timeout 30 bash -c 'until test -f "$RUNNER_TEMP/ralf-temporal/stopped"; do sleep 1; done'
          fi
