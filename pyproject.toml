[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ralf-agent"
version = "0.1.0.dev51"
description = "Reliable agent tasks with durable approvals and recovery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
redis = ["redis>=5,<9"]
postgres = ["psycopg[binary]>=3.2,<4"]
remote = ["redis>=5,<9", "psycopg[binary]>=3.2,<4"]
temporal = ["temporalio>=1.10,<2", "psycopg[binary]>=3.2,<4"]
server = ["uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "setuptools>=77"]

[project.scripts]
ralf = "ralf_agent.cli:main"
ralf-evaluate-planning = "ralf_agent.planning_evaluation_cli:main"
ralf-evaluate-business = "ralf_agent.business_evaluation_cli:main"
ralf-check-model = "ralf_agent.model_check_cli:main"
ralf-watch-events = "ralf_agent.event_watch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
